<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="100" height="100" rx="20" fill="#0f0f0f"/>

  <!-- Outer wheel rim -->
  <circle cx="50" cy="50" r="42" stroke="#4ade80" stroke-width="5"/>

  <!-- Inner hub -->
  <circle cx="50" cy="50" r="10" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="2"/>

  <!-- Spokes (6, evenly spaced) -->
  <line x1="50" y1="40" x2="50" y2="12"  stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="60" x2="50" y2="88"  stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="40.2" y1="44.5" x2="16.3" y2="30.5" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="59.8" y1="55.5" x2="83.7" y2="69.5" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="40.2" y1="55.5" x2="16.3" y2="69.5" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="59.8" y1="44.5" x2="83.7" y2="30.5" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>

  <!-- RB text -->
  <text
    x="50" y="51"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#4ade80"
    font-size="24"
    font-weight="800"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    letter-spacing="-1"
  >RB</text>
</svg>
